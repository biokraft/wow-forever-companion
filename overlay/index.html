<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Forever Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="panel">
    <header id="bar">
      <button id="history" type="button" title="Chats">☰</button>
      <button id="planbtn" type="button" title="Your game plan" aria-pressed="false">Plan</button>
      <span class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28 C11 24.5 6.5 24.5 2.5 26 L2.5 14.5 C6.5 13 11 13 16 16.5 Z M16 28 C21 24.5 25.5 24.5 29.5 26 L29.5 14.5 C25.5 13 21 13 16 16.5 Z" fill="#3a2a12" stroke="#ffd100" stroke-width="2" stroke-linejoin="round"/><path d="M16 1 L17.6 5.9 L22.5 7.5 L17.6 9.1 L16 14 L14.4 9.1 L9.5 7.5 L14.4 5.9 Z" fill="#ffd100"/></svg>Forever Companion</span>
      <span id="status" class="muted"></span>
      <button id="newchat" type="button" title="New chat">+</button>
      <button id="collapse" title="Collapse">–</button>
      <button id="close" title="Hide (Esc)">×</button>
    </header>
    <section id="setup" hidden>
      <h2>Almost there</h2>
      <ul id="problems"></ul>
      <button id="recheck">Check again</button>
    </section>
    <section id="chat">
      <aside id="drawer" hidden>
        <button id="drawer-new" type="button" class="drawer-new">+ New chat</button>
        <div id="chatlist"></div>
        <div class="chat-row"><button id="report" type="button" class="chat-title" title="Opens a pre-filled GitHub form in your browser"><span class="name muted">Report a problem</span></button></div>
      </aside>
      <div id="plan" hidden></div>
      <div id="welcome" hidden>
        <div id="hint-rows"></div>
        <div id="starters"></div>
        <div class="muted">Answers come from an AI and can be wrong.</div>
      </div>
      <div id="messages" aria-live="polite"></div>
      <form id="ask">
        <div id="hintbar" hidden></div>
        <textarea id="input" rows="2" placeholder="Ask your companion… (Enter to send, Esc to hide)"></textarea>
        <div class="row">
          <label class="look"><input type="checkbox" id="look"> look</label>
          <select id="model" title="Model"></select>
          <input type="range" id="opacity" min="40" max="100" step="5" value="100" title="Window opacity" aria-label="Window opacity">
          <button id="stop" type="button" title="Stop this answer" hidden>Stop</button>
          <span id="usage" class="muted"></span>
        </div>
      </form>
    </section>
  </main>
  <script type="module" src="renderer.js"></script>
</body>
</html>
